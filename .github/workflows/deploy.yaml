name: Build and publish package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Whether to publish the package"
        required: false
        default: false
        type: boolean

  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "*.md"
      - "dev/**"
      - "e2e/**"
      - "playwright.config.ts"
      - "vite.config.ts"
      - ".tool-versions"
      - "biome.json"
      - "bunfig.toml"
      - CODEOWNERS
      - LICENSE

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-test:
    name: Build and test
    uses: ./.github/workflows/build-and-test.yaml
    with:
      upload-artifacts: true
    secrets:
      READER_TOKEN: ${{ secrets.READER_TOKEN }}

  publish:
    name: Upload to CDN and publish package
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .tool-versions
          registries: |
            https://registry.npmjs.org/
            @navikt:https://npm.pkg.github.com|$TOKEN

      - name: Check if version is newer than the published version
        env:
          READER_TOKEN: ${{ secrets.READER_TOKEN }}
        run: bun .github/scripts/check-version.ts

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output

      - name: Rename PDFium WASM with hash
        run: mv node_modules/@embedpdf/pdfium/dist/pdfium.wasm "node_modules/@embedpdf/pdfium/dist/pdfium-${{ needs.build-and-test.outputs.pdfium-hash }}.wasm"

      - name: Upload PDFium WASM to CDN
        uses: nais/deploy/actions/cdn-upload/v2@1de80da70ad26556ecdc5964a8b7ec3bbed98120 # v2
        with:
          team: klage
          source: node_modules/@embedpdf/pdfium/dist/pdfium-${{ needs.build-and-test.outputs.pdfium-hash }}.wasm
          source_keep_parent_name: false
          destination: klage-file-viewer/pdfium
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Prepare Tesseract CDN files
        env:
          TESSERACT_VERSION: ${{ needs.build-and-test.outputs.tesseract-version }}
        run: |
          mkdir -p tesseract-cdn/lang
          cp node_modules/tesseract.js/dist/worker.min.js tesseract-cdn/
          cp node_modules/tesseract.js-core/tesseract-core*.wasm.js tesseract-cdn/
          curl -fsSL -o tesseract-cdn/lang/nor.traineddata.gz "https://cdn.jsdelivr.net/npm/@tesseract.js-data/nor/4.0.0_best_int/nor.traineddata.gz"
          curl -fsSL -o tesseract-cdn/lang/eng.traineddata.gz "https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng/4.0.0_best_int/eng.traineddata.gz"
          curl -fsSL -o tesseract-cdn/lang/pol.traineddata.gz "https://cdn.jsdelivr.net/npm/@tesseract.js-data/pol/4.0.0_best_int/pol.traineddata.gz"

      - name: Upload Tesseract files to CDN
        uses: nais/deploy/actions/cdn-upload/v2@1de80da70ad26556ecdc5964a8b7ec3bbed98120 # v2
        with:
          team: klage
          source: tesseract-cdn/
          source_keep_parent_name: false
          destination: klage-file-viewer/tesseract/v${{ needs.build-and-test.outputs.tesseract-version }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Publish package
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun publish

      - name: Generate changelog
        id: changelog
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          VERSION="$(jq -r .version package.json)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "## Changes" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          if [ -n "$PREVIOUS_TAG" ]; then
            git log "${PREVIOUS_TAG}..HEAD" --pretty=format:"- %s" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "**Full Changelog**: [${PREVIOUS_TAG}...${VERSION}](${REPO_URL}/compare/${PREVIOUS_TAG}...${VERSION})" >> RELEASE_NOTES.md
          else
            git log --pretty=format:"- %s" >> RELEASE_NOTES.md
          fi

      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.changelog.outputs.version }}
          bodyFile: "RELEASE_NOTES.md"
